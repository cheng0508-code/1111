<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>神州信息 · 资料下载</title>
<style>
  :root {
    --brand: #1f4ea1;
    --brand2: #2f6fe0;
    --ink: #16243b;
    --muted: #6b7894;
    --bg: #eef3fb;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex; flex-direction: column;
    height: 100dvh;
    overflow: hidden;
  }
  /* 顶部品牌条 */
  .topbar {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 12px;
    padding: 14px 18px;
    background: #fff;
    border-bottom: 1px solid #e6ecf5;
  }
  .logo {
    width: 40px; height: 40px; border-radius: 11px;
    background: linear-gradient(135deg, var(--brand), var(--brand2));
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 800; font-size: 17px; letter-spacing: 1px;
    flex: 0 0 auto;
  }
  .titles { line-height: 1.25; }
  .titles h1 { margin: 0; font-size: 16px; font-weight: 700; }
  .titles p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }

  /* 预览区 */
  .preview {
    flex: 1 1 auto;
    min-height: 0;
    margin: 12px;
    background: #fff;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(31, 78, 161, 0.08);
    position: relative;
  }
  .preview iframe {
    width: 100%; height: 100%;
    border: 0; display: block;
  }
  .preview .fallback {
    position: absolute; inset: 0;
    display: none;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 24px; text-align: center; color: var(--muted);
  }

  /* 底部超大下载按钮 */
  .cta {
    flex: 0 0 auto;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    background: #fff;
    border-top: 1px solid #e6ecf5;
  }
  .btn-download {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%;
    padding: 17px 20px;
    border: none; border-radius: 14px;
    background: linear-gradient(135deg, var(--brand), var(--brand2));
    color: #fff; font-size: 18px; font-weight: 700; letter-spacing: .5px;
    box-shadow: 0 12px 28px rgba(47, 111, 224, 0.35);
    cursor: pointer; text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-download:active { transform: translateY(1px); }
  .btn-download svg { width: 22px; height: 22px; }
  .secondary {
    display: block; text-align: center;
    margin-top: 10px; font-size: 13px; color: var(--brand);
    text-decoration: none;
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="logo">神</div>
    <div class="titles">
      <h1>神州信息 · 公司资料</h1>
      <p>英文版 PDF · 扫码在线预览与下载</p>
    </div>
  </div>

  <div class="preview">
    <iframe
      id="pdfFrame"
      src="shenzhou-info-en.pdf#toolbar=1&navpanes=0&view=FitH"
      title="PDF 预览"
    ></iframe>
    <div class="fallback" id="fallback">
      <div style="font-size:46px">📄</div>
      <div>当前浏览器暂不支持内嵌预览,<br/>点击下方按钮即可下载 / 打开 PDF</div>
    </div>
  </div>

  <div class="cta">
    <a class="btn-download" href="shenzhou-info-en.pdf" download="神州信息_英文.pdf">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M5 21h14"/>
      </svg>
      下载 PDF 资料
    </a>
    <a class="secondary" href="shenzhou-info-en.pdf" target="_blank" rel="noopener">在新标签页中打开预览 ↗</a>
  </div>

  <script>
    // 若 iframe 在数秒内未成功加载 PDF,显示兜底提示
    setTimeout(function () {
      try {
        var f = document.getElementById('pdfFrame');
        if (!f || !f.contentWindow || f.contentWindow.location.href === 'about:blank') {
          document.getElementById('fallback').style.display = 'flex';
        }
      } catch (e) { /* 跨域无法读取,忽略 */ }
    }, 2500);
  </script>
</body>
</html>
